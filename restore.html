<body class="theme-light"><script>if(localStorage.getItem("bigfive_theme")==="dark")document.body.classList.remove("theme-light");</script>
<div class="container">

  <h1 class="page-title">購入を復元する</h1>
  <p class="page-updated">機種変更をしたとき・ブラウザのデータが消えたとき</p>

  <div class="pay-box" id="rsForm">
    <h2>600円で開いた内容を、この端末で開き直します</h2>
    <p>お支払いのときに入力した<strong>メールアドレス</strong>と、お支払いに使った<strong>カード番号の下4けた</strong>を入れてください。どちらも、Stripeから届いた領収メールに書いてあります。</p>
    <p style="margin-top:14px"><label>メールアドレス<br><input id="rsEmail" type="email" autocomplete="email" inputmode="email" style="width:100%;max-width:360px;padding:10px;font:inherit;border-radius:8px;border:1px solid rgba(139,92,246,0.4)"></label></p>
    <p><label>カード番号の下4けた<br><input id="rsLast4" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" style="width:8em;padding:10px;font:inherit;border-radius:8px;border:1px solid rgba(139,92,246,0.4)"></label></p>
    <p class="pay-small">Apple Pay で支払った場合は、領収メールに書かれている下4けたを入れてください。</p>
    <button class="pay-btn" id="rsGo" type="button" disabled>復元する</button>
    <p class="pay-small pay-hidden" id="rsError" style="margin-top:12px"></p>
  </div>

  <div class="pay-box pay-hidden" id="rsOk">
    <h2>開きました</h2>
    <p>30項目の詳細レポートと、サイト内の全ての診断が、この端末で開いています。</p>
    <a class="pay-btn" href="mypage.html">マイページへ</a>
    <a class="pay-btn sub" href="diagnoses.html">診断の一覧を見る</a>
  </div>

  <p class="pay-small" style="text-align:center;margin-top:24px">領収メールが見つからないときは <a href="https://docs.google.com/forms/d/e/1FAIpQLSdF_53zxYjvJtJjqVh2U578K_BHDhqSqAAHT6P-tXGQdvNQZg/viewform" target="_blank" rel="noopener">お問い合わせフォーム</a> へ。お支払いを確かめて、ご案内します。</p>

</div>
<script src="unlock.js?v=20261114"></script>
<script src="pay.js?v=20261017"></script>
<script>

(function () {
  var P = window.BigFivePay;
  var email = document.getElementById('rsEmail'), last4 = document.getElementById('rsLast4');
  var go = document.getElementById('rsGo'), err = document.getElementById('rsError');
  function ready() { go.disabled = !(/^[^\s@]+@[^\s@]+$/.test(email.value.trim()) && /^[0-9]{4}$/.test(last4.value.trim())); }
  email.addEventListener('input', ready); last4.addEventListener('input', ready);
  var MSG = {
    not_found: '見つかりませんでした。お支払いのときのメールアドレスと、カード番号の下4けたをもう一度お確かめください。',
    too_many: '試した回数が多いため、今日はここまでにさせてください。明日もう一度お試しいただくか、お問い合わせフォームからご連絡ください。',
    device_limit: 'この購入で開ける端末の数（5台）に達しています。お問い合わせフォームからご連絡ください。',
    input: 'メールアドレスと、4けたの数字を入れてください。'
  };
  go.addEventListener('click', function () {
    if (!P) return;
    go.disabled = true; go.textContent = '確かめています…'; err.classList.add('pay-hidden');
    P.restore(email.value.trim(), last4.value.trim()).then(function (r) {
      go.textContent = '復元する'; ready();
      if (r && r.ok) {
        document.getElementById('rsForm').classList.add('pay-hidden');
        document.getElementById('rsOk').classList.remove('pay-hidden');
        return;
      }
      err.textContent = MSG[r && r.error] || 'いま確かめられませんでした。少し時間をおいて、もう一度お試しください。';
      err.classList.remove('pay-hidden');
    });
  });
})();

</script>
