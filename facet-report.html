<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="favicon-180.png">
<title>30項目の詳細レポート — ビッグファイブで本当の自分を知る</title>
<meta name="description" content="120問版の診断結果から、30の下位項目それぞれについて詳しく解説するレポートです。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="light-mode.css">
<style>
  :root { --purple: #8b5cf6; --pink: #ec4899; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans JP', system-ui, sans-serif;
    line-height: 1.8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 16px 80px;
  }

  /* ===== サイト共通のカード（result.html と同じ定義を使う） ===== */
  .report-card {
    background: rgba(26,10,62,0.45);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 16px; padding: 22px 24px;
    margin-bottom: 20px; backdrop-filter: blur(8px);
    width: 100%; max-width: 480px;
  }
  .report-card-title { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 6px; color: var(--text); }
  .report-card-note { font-size: 12px; color: var(--dim); text-align: center; margin-bottom: 10px; }
  .report-factor-text { font-size: 13.5px; line-height: 1.9; color: var(--text); }

  /* ===== スコアのバー（result.html と同じ定義を使う） ===== */
  .facet-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .facet-name { font-size: 12px; color: #94a3b8; width: 72px; flex-shrink: 0; }
  .facet-bar-bg { flex: 1; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .facet-bar { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
  .facet-score { font-size: 11px; color: var(--dim); width: 16px; text-align: center; font-weight: 600; }

  /* ===== このページ専用 ===== */
  .fr-head { width: 100%; max-width: 480px; text-align: center; margin-bottom: 18px; }
  .fr-head h1 { font-size: 19px; font-weight: 900; letter-spacing: .02em; }
  .fr-head p { font-size: 12px; color: var(--dim); margin-top: 6px; }

  .fr-cover { display: flex; gap: 12px; flex-wrap: wrap; }
  .fr-cover-col { flex: 1 1 190px; }
  .fr-cover-col h3 { font-size: 12px; color: var(--dim); font-weight: 500; margin-bottom: 6px; }
  .fr-cover-list { display: flex; flex-direction: column; gap: 5px; }
  .fr-cover-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .fr-cover-item b { font-weight: 700; }
  .fr-chip {
    font-size: 11px; font-weight: 700; color: #fff;
    border-radius: 999px; padding: 1px 9px; margin-left: auto;
  }

  /* ===== 5因子の五角形（2026-07-31追加・準也さん提案） =====
     30項目マップの前に「まず全体像」を置く。無料側の結果ページには五角形が無いので重複しない。 */
  .fr-penta { display: flex; justify-content: center; margin: 4px 0 2px; }
  .fr-penta svg { width: 100%; max-width: 280px; height: auto; }
  .fr-penta-grid { fill: none; stroke: rgba(255,255,255,0.10); stroke-width: 1; }
  .fr-penta-axis { stroke: rgba(255,255,255,0.10); stroke-width: 1; }
  .fr-penta-area { fill: rgba(139,92,246,0.28); stroke: #8b5cf6; stroke-width: 2; stroke-linejoin: round; }
  .fr-penta-dot { fill: #8b5cf6; }
  .fr-penta-caption { font-size: 11.5px; color: var(--dim); line-height: 1.8; margin: 8px 0 14px; }
  /* 五角形の下に置く「中身」＝性格ごとに6本の棒（2026-08-01・準也さん案） */
  .fr-fbars-group { margin-bottom: 14px; }
  .fr-fbars-group:last-child { margin-bottom: 0; }
  .fr-fbars-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12.5px; font-weight: 700; margin: 0 0 4px;
    padding-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .fr-fbars-avg { font-size: 11px; font-weight: 500; color: var(--dim); }
  body.theme-light .fr-penta-caption,
  body.theme-light .fr-fbars-avg { color: #64748b; }
  body.theme-light .fr-fbars-head { border-bottom-color: rgba(0,0,0,0.08); }
  .fr-penta-label { font-size: 11px; font-weight: 700; }
  .fr-penta-val { font-size: 10.5px; }
  body.theme-light .fr-penta-grid,
  body.theme-light .fr-penta-axis { stroke: rgba(0,0,0,0.13); }

  /* ===== 五角形の下に置く「中身」＝性格ごとに6本、まん中3を基準にした横棒 =====
     準也さん案（8/1）「五角形のパラメーターの表示の後ろに棒グラフを6本並べる」＋
     「3基準でプラスとマイナスの横棒バー」。左＝控えめ／右＝強い で、凸凹が一目で分かる形。 */
  .fr-fbars-legend {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--dim); margin: 0 0 8px; padding: 0 26px 0 66px;
  }
  .fr-fbars-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .fr-fbars-name {
    width: 62px; flex-shrink: 0; font-size: 11.5px; color: var(--dim);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fr-fbars-track {
    position: relative; flex: 1; height: 14px; border-radius: 3px;
    background: rgba(255,255,255,0.045);
  }
  .fr-fbars-center {
    position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px;
    background: rgba(255,255,255,0.3); transform: translateX(-0.5px);
  }
  .fr-fbars-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; }
  .fr-fbars-dot {
    position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
    border-radius: 50%; transform: translate(-50%,-50%);
  }
  .fr-fbars-score { width: 14px; flex-shrink: 0; font-size: 11px; color: var(--dim); text-align: center; }
  body.theme-light .fr-fbars-track { background: rgba(0,0,0,0.05); }
  body.theme-light .fr-fbars-center { background: rgba(0,0,0,0.22); }
  body.theme-light .fr-fbars-legend,
  body.theme-light .fr-fbars-name,
  body.theme-light .fr-fbars-score { color: #64748b; }

  .fr-guide dt { font-size: 13px; font-weight: 700; margin-top: 12px; }
  .fr-guide dd { font-size: 12.5px; color: var(--dim); line-height: 1.85; }
  .fr-scale { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .fr-scale span {
    font-size: 11px; color: var(--dim);
    border: 1px solid rgba(139,92,246,0.25); border-radius: 8px; padding: 3px 8px;
  }

  .fr-factor-title {
    font-size: 14px; font-weight: 700; margin: 0 0 4px;
    padding-left: 10px; border-left: 4px solid var(--purple);
  }
  .fr-facet { border-top: 1px solid rgba(255,255,255,0.07); padding: 14px 0 2px; }
  .fr-facet:first-of-type { border-top: none; }
  .fr-facet-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .fr-facet-name { font-size: 14.5px; font-weight: 700; }
  .fr-facet-desc { font-size: 11.5px; color: var(--dim); }
  .fr-facet-score {
    margin-left: auto; font-size: 12px; font-weight: 700;
    color: #fff; border-radius: 999px; padding: 1px 10px;
  }

  .fr-gap {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: rgba(139,92,246,0.10); border: 1px solid rgba(139,92,246,0.28);
    font-size: 12.5px; line-height: 1.85;
  }
  .fr-gap b { color: var(--purple); }

  /* 凸凹の図（同じ因子の中でどれだけ開いているか） */
  .fr-gapfig { margin: 0 0 10px; }
  .fr-gapfig-row { display: flex; align-items: center; gap: 7px; }
  .fr-gapfig-label {
    width: 58px; flex-shrink: 0; font-size: 10.5px; color: var(--dim);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fr-gapfig-label.right { text-align: left; }
  .fr-gapfig-track {
    position: relative; flex: 1; height: 16px;
    background: rgba(255,255,255,0.06); border-radius: 3px;
  }
  .fr-gapfig-fill { position: absolute; top: 6px; height: 4px; border-radius: 2px; opacity: .5; }
  .fr-gapfig-pt {
    position: absolute; top: 50%; transform: translate(-50%,-50%);
    width: 16px; height: 16px; border-radius: 50%;
    color: #fff; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .fr-gapfig-cap { font-size: 10.5px; color: var(--dim); text-align: center; margin: 5px 0 0; }
  body.theme-light .fr-gapfig-track { background: rgba(0,0,0,0.06); }
  body.theme-light .fr-gapfig-label,
  body.theme-light .fr-gapfig-cap { color: #64748b; }

  .fr-top3 { display: flex; flex-direction: column; gap: 12px; }
  .fr-top3-item { display: flex; gap: 12px; align-items: flex-start; }
  .fr-top3-rank {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .fr-top3-body { font-size: 13px; line-height: 1.8; }

  .fr-back {
    display: inline-block; margin-top: 4px;
    color: var(--purple); font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .fr-msg { font-size: 13.5px; color: var(--dim); text-align: center; padding: 30px 0; }

  /* クロス分析章（愛着×30項目・2026-08-02） */
  .fr-cross-meta {
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2);
    border-radius: 8px; padding: 8px 10px; margin: 0 0 8px;
    font-size: 10.5px; color: var(--dim); line-height: 1.6;
  }
  .fr-cross-fold { border-top: 1px solid rgba(255,255,255,0.07); padding: 12px 0 4px; margin-top: 4px; }
  .fr-cross-fold summary {
    cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--purple);
    list-style-position: inside; margin-bottom: 8px;
  }

  /* ライトモード（既存クラスは light-mode.css が面倒を見る。ここは追加分だけ） */
  body.theme-light .fr-head p,
  body.theme-light .fr-cover-col h3,
  body.theme-light .fr-facet-desc,
  body.theme-light .fr-guide dd,
  body.theme-light .fr-scale span,
  body.theme-light .fr-msg { color: #64748b; }
  body.theme-light .fr-facet { border-top-color: rgba(0,0,0,0.08); }
  body.theme-light .fr-gap { background: rgba(139,92,246,0.07); border-color: rgba(139,92,246,0.22); }
  body.theme-light .fr-cross-meta { background: rgba(139,92,246,0.06); color: #64748b; }
  body.theme-light .fr-cross-fold { border-top-color: rgba(0,0,0,0.08); }

  @media (max-width: 420px) {
    body { padding: 48px 12px 60px; }
    .report-card { padding: 18px 16px; }
    .facet-name { width: 64px; }
  }
  .ai-mode-choice { margin: 10px 0 4px; }
  .ai-mode-btns { display: flex; flex-direction: column; gap: 6px; }
  .ai-mode-btn {
    width: 100%; text-align: left; padding: 11px 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(139,92,246,0.35);
    border-radius: 10px; color: inherit; opacity: .75; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all .15s;
  }
  .ai-mode-btn::before { content: "○ "; }
  .ai-mode-btn.on { background: rgba(139,92,246,0.18); border-color: #8b5cf6; opacity: 1; }
  .ai-mode-btn.on::before { content: "● "; }
</style>
</head>
<body class="theme-light">

<div class="fr-head">
  <h1>30項目の詳細レポート</h1>
  <p>120問版の答えから、5つの性格それぞれを6つに分けて読み解いたものです</p>
</div>

<div id="frBody" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>

<script>
// ===== 30項目の定義（result.html:2512 の facetMeta と完全一致させる。名前を勝手に変えない） =====
// facets（30桁）の並び： N0-5・E6-11・O12-17・A18-23・C24-29
var FACET_META = [
  { key:'N1', name:'不安',       factor:'N', desc:'心配事や不安を感じやすいか' },
  { key:'N2', name:'怒り',       factor:'N', desc:'イライラや怒りを感じやすいか' },
  { key:'N3', name:'抑うつ',     factor:'N', desc:'気分が落ち込みやすいか' },
  { key:'N4', name:'自己意識',   factor:'N', desc:'他人の目を気にするか' },
  { key:'N5', name:'無抑制',     factor:'N', desc:'衝動的に行動してしまうか' },
  { key:'N6', name:'脆弱性',     factor:'N', desc:'ストレスに圧倒されやすいか' },
  { key:'E1', name:'友好性',     factor:'E', desc:'友人を作りやすいか' },
  { key:'E2', name:'群居性',     factor:'E', desc:'大勢の中にいるのが好きか' },
  { key:'E3', name:'主張性',     factor:'E', desc:'自分からリードするか' },
  { key:'E4', name:'活動性',     factor:'E', desc:'常に活動的で忙しいか' },
  { key:'E5', name:'刺激追求',   factor:'E', desc:'スリルや興奮を求めるか' },
  { key:'E6', name:'陽気さ',     factor:'E', desc:'明るく楽観的か' },
  { key:'O1', name:'想像力',     factor:'O', desc:'想像力や空想を楽しむか' },
  { key:'O2', name:'芸術的興味', factor:'O', desc:'芸術や美に感応するか' },
  { key:'O3', name:'感情性',     factor:'O', desc:'感情を深く感じるか' },
  { key:'O4', name:'冒険性',     factor:'O', desc:'新しい体験を好むか' },
  { key:'O5', name:'知性',       factor:'O', desc:'知的な探求を好むか' },
  { key:'O6', name:'自由主義',   factor:'O', desc:'既存の価値観を問い直すか' },
  { key:'A1', name:'信頼',       factor:'A', desc:'他人を信用できるか' },
  { key:'A2', name:'道徳性',     factor:'A', desc:'他者を利用しないか' },
  { key:'A3', name:'利他性',     factor:'A', desc:'他者を助けたいと思うか' },
  { key:'A4', name:'協調性',     factor:'A', desc:'争いを避けるか' },
  { key:'A5', name:'謙虚さ',     factor:'A', desc:'自分を控えめにするか' },
  { key:'A6', name:'共感性',     factor:'A', desc:'他人の悲しみに寄り添うか' },
  { key:'C1', name:'有能性',     factor:'C', desc:'効率よく物事をこなせるか' },
  { key:'C2', name:'秩序性',     factor:'C', desc:'整理整頓が好きか' },
  { key:'C3', name:'義務感',     factor:'C', desc:'約束やルールを守るか' },
  { key:'C4', name:'達成努力',   factor:'C', desc:'期待以上の努力をするか' },
  { key:'C5', name:'自己規律',   factor:'C', desc:'計画を実行に移せるか' },
  { key:'C6', name:'慎重さ',     factor:'C', desc:'考慮してから行動するか' }
];
var FACTOR = {
  O: { name:'開放性',   color:'#8b5cf6', sub:'新しいものへの開かれ方' },
  C: { name:'誠実性',   color:'#3b82f6', sub:'物事の進め方・律し方' },
  E: { name:'外向性',   color:'#f59e0b', sub:'人やできごとへの向かい方' },
  A: { name:'協調性',   color:'#10b981', sub:'人との関わり方' },
  N: { name:'感受性',   color:'#ef4444', sub:'感情の動きやすさ' }
};
var DISPLAY_ORDER = ['O','C','E','A','N'];   // 表示順（設計書§1）

var params    = new URLSearchParams(location.search);
var facets    = params.get('facets') || '';
var typeCode  = params.get('code') || '';
var gender    = params.get('gender') || '';
var isSample  = params.get('sample') === '1';   // 見本の点数で見るサンプル閲覧（案内1枚目から）
var box       = document.getElementById('frBody');

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function msg(t){ box.innerHTML = '<p class="fr-msg">' + esc(t) + '</p>' +
  '<p style="text-align:center"><a class="fr-back" href="quiz.html?v=120">120問版を受ける →</a></p>'; }

if (!/^[1-5]{30}$/.test(facets)) {
  msg('このレポートは、120問版を受けた方の結果から作られます。');
} else {
  var scores = {};
  FACET_META.forEach(function(m, i){ scores[m.key] = parseInt(facets[i], 10); });

  // 本文の取り寄せ。本番はワーカー越し（R2倉庫にある・設計書§2.5）。
  // ローカル確認のときだけ、同じ場所に置いた _facet-texts-local.json を読む（gitには入れない）。
  var isLocal = location.protocol === 'file:' ||
                location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  // 愛着・HSPの結果（同じ端末のlocalStorage）。あればクロス分析章の材料になる（2026-08-02追加・第2弾でHSP拡張）
  var attData = null;
  try { attData = JSON.parse(localStorage.getItem('attachment_result')); } catch (e) {}
  var attKey = attData && ['secure','anxious','avoidant','fearful'].indexOf(attData.typeKey) >= 0
             ? attData.typeKey : '';
  var hspTotal = null;
  try {
    var hspData = JSON.parse(localStorage.getItem('hsp_result'));
    if (hspData && hspData.scores && typeof hspData.scores.total === 'number') hspTotal = hspData.scores.total;
  } catch (e) {}
  var hspLv = hspTotal === null ? '' : (hspTotal >= 34 ? 'high' : (hspTotal <= 19 ? 'low' : ''));
  // 第3弾：インポスター・EQ／第4弾：ダークトライアド（しきい値はワーカーと同一）
  var impData = null;
  try { impData = JSON.parse(localStorage.getItem('impostor_result')); } catch (e) {}
  var impSev = impData && ['high','moderate','low'].indexOf(impData.severityLevel) >= 0 ? impData.severityLevel : '';
  var impDom = impData && ['perfectionist','superhero','naturalGenius','soloist','expert'].indexOf(impData.dominantType) >= 0
             ? impData.dominantType : '';
  var eqData = null;
  try { eqData = JSON.parse(localStorage.getItem('eq_result')); } catch (e) {}
  var eqLv = eqData && ['very_high','high','average','growth'].indexOf(eqData.level) >= 0 ? eqData.level : '';
  var eqWk = eqData && ['awareness','regulation','motivation','empathy','social'].indexOf(eqData.weakest) >= 0 ? eqData.weakest : '';
  var dtData = null;
  try { dtData = JSON.parse(localStorage.getItem('dark_triad_result')); } catch (e) {}
  var dtS = dtData && dtData.scores ? dtData.scores : null;
  function dtLv(v){ return (typeof v === 'number') ? (v >= 60 ? 'high' : (v < 40 ? 'low' : '')) : ''; }
  var narcLv = dtS ? dtLv(dtS.nPct) : '', machLv = dtS ? dtLv(dtS.mPct) : '', psyLv = dtS ? dtLv(dtS.pPct) : '';
  // 第5弾：統制・マインドセット・SDT・恋愛・価値観（2026-08-03）
  var locusData = null;
  try { locusData = JSON.parse(localStorage.getItem('locus_result')); } catch (e) {}
  var locusKey = locusData && ['internal','external'].indexOf(locusData.type) >= 0 ? locusData.type : '';
  var locusTaken = !!(locusData && locusData.type);
  var mindData = null;
  try { mindData = JSON.parse(localStorage.getItem('mindset_result')); } catch (e) {}
  var mindKey = mindData && ['growth','fixed'].indexOf(mindData.type) >= 0 ? mindData.type : '';
  var mindTaken = !!(mindData && mindData.type);
  var sdtData = null;
  try { sdtData = JSON.parse(localStorage.getItem('sdt_result')); } catch (e) {}
  var sdtKey = sdtData && ['autonomy','competence','relatedness'].indexOf(sdtData.strongest) >= 0 ? sdtData.strongest : '';
  var loveData = null;
  try { loveData = JSON.parse(localStorage.getItem('love_result')); } catch (e) {}
  var loveKey = loveData && ['eros','ludus','storge','pragma','mania','agape'].indexOf(loveData.mainStyle) >= 0
              ? loveData.mainStyle : '';
  var valData = null;
  try { valData = JSON.parse(localStorage.getItem('schwartz_result')); } catch (e) {}
  var valKey = valData && valData.top3 && valData.top3[0] ? String(valData.top3[0]) : '';
  // 第6弾：HEXACO（Hの生値・4.0以上=高／2.5未満=低）
  var hexData = null;
  try { hexData = JSON.parse(localStorage.getItem('hexaco_result')); } catch (e) {}
  var hexRaw = hexData && hexData.scores && typeof hexData.scores.H === 'number' ? hexData.scores.H : null;
  var hexLv = hexRaw === null ? '' : (hexRaw >= 4.0 ? 'high' : (hexRaw < 2.5 ? 'low' : ''));
  // 第7弾：RIASECトップタイプ（ホランドコード先頭1文字）
  var riData = null;
  try { riData = JSON.parse(localStorage.getItem('riasec_result')); } catch (e) {}
  var riTop = riData && riData.scores && riData.scores.code ? String(riData.scores.code).charAt(0) : '';
  if ('RIASEC'.indexOf(riTop) < 0) riTop = '';

  var url = isLocal ? '_facet-texts-local.json'
                    : ('/api/facet?facets=' + facets +
                       (attKey ? '&att=' + attKey : '') +
                       (hspTotal !== null ? '&hsp=' + hspTotal : '') +
                       (impSev ? '&imp=' + impSev : '') +
                       (impDom ? '&impdom=' + impDom : '') +
                       (eqLv ? '&eq=' + eqLv : '') +
                       (eqWk ? '&eqw=' + eqWk : '') +
                       (dtS ? '&dtn=' + dtS.nPct + '&dtm=' + dtS.mPct + '&dtp=' + dtS.pPct : '') +
                       (locusKey ? '&locus=' + locusKey : '') +
                       (mindKey ? '&mind=' + mindKey : '') +
                       (sdtKey ? '&sdtk=' + sdtKey : '') +
                       (loveKey ? '&lovek=' + loveKey : '') +
                       (valKey ? '&val=' + encodeURIComponent(valKey) : '') +
                       (hexRaw !== null ? '&hexh=' + hexRaw : '') +
                       (riTop ? '&ri=' + riTop : ''));

  // ワーカーと同じ該当判定（ローカル確認用。本番はワーカーが選んで _cross で返す）
  function matchCross(cross){
    var hit = (cross.parts || []).filter(function(p){
      if (!p.type && !p.hsp && !p.imp && !p.impdom && !p.eq && !p.eqw && !p.narc && !p.mach && !p.psy &&
          !p.locus && !p.mind && !p.sdtk && !p.lovek && !p.val && !p.hexh && !p.ri) return false;
      if (p.type && p.type !== attKey) return false;
      if (p.hsp && p.hsp !== hspLv) return false;
      if (p.imp && p.imp !== impSev) return false;
      if (p.impdom && p.impdom !== impDom) return false;
      if (p.eq && p.eq !== eqLv) return false;
      if (p.eqw && p.eqw !== eqWk) return false;
      if (p.narc && p.narc !== narcLv) return false;
      if (p.mach && p.mach !== machLv) return false;
      if (p.psy && p.psy !== psyLv) return false;
      if (p.locus && p.locus !== locusKey) return false;
      if (p.mind && p.mind !== mindKey) return false;
      if (p.sdtk && p.sdtk !== sdtKey) return false;
      if (p.lovek && p.lovek !== loveKey) return false;
      if (p.val && p.val !== valKey) return false;
      if (p.hexh && p.hexh !== hexLv) return false;
      if (p.ri && p.ri !== riTop) return false;
      if (p.facet) {
        var idx = -1;
        for (var j = 0; j < FACET_META.length; j++) if (FACET_META[j].key === p.facet) idx = j;
        if (idx < 0) return false;
        var s = parseInt(facets[idx], 10);
        return p.dir === 'high' ? s >= 4 : s <= 2;
      }
      return true;
    });
    var drop = {};
    hit.forEach(function(p){ (p.supersedes || []).forEach(function(id){ drop[id] = 1; }); });
    hit = hit.filter(function(p){ return !drop[p.id]; })
             .sort(function(a, b){ return b.total - a.total; });
    var intros = [];
    function pushIntro(key, test){
      if ((cross.intro || {})[key]) intros.push({ test: test, body: cross.intro[key] });
    }
    if (attKey) pushIntro(attKey, 'att');
    if (hspLv) pushIntro('hsp_' + hspLv, 'hsp');
    if (impSev === 'high') pushIntro('imp_high', 'imp');
    if (eqLv || eqWk) pushIntro('eq', 'eq');
    if (dtS) pushIntro('dark', 'dark');
    if (locusKey) pushIntro('locus', 'locus');
    if (mindKey) pushIntro('mind', 'mind');
    if (sdtKey) pushIntro('sdt', 'sdt');
    if (loveKey) pushIntro('love', 'love');
    if (valKey) pushIntro('values', 'values');
    if (hexLv) pushIntro('hexaco', 'hexaco');
    if (riTop) pushIntro('riasec', 'riasec');
    return { intros: intros, parts: hit };
  }

  fetch(url)
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      if (isLocal && (attKey || hspLv || impSev || impDom || eqLv || eqWk || dtS ||
                      locusKey || mindKey || sdtKey || loveKey || valKey || hexLv || riTop)) {
        return fetch('_cross-texts-local.json')
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(cross){
            if (cross) data._cross = matchCross(cross);
            return data;
          })
          .catch(function(){ return data; });
      }
      return data;
    })
    .then(function(data){ render(data); })
    .catch(function(){ msg('レポートを読み込めませんでした。時間をおいて、もう一度お試しください。'); });
}

function render(data){
  var html = '';

  if (isSample) {
    html += '<div class="report-card" style="border-color:rgba(236,72,153,0.45);">' +
      '<p class="report-card-note" style="margin:0;">これは<b>見本の点数</b>で作ったサンプルです。' +
      'あなた自身のレポートは、120問版の診断結果ページから開けます。</p></div>';
  }

  // ---- 表紙：強く出ている5つ／控えめな5つ ----
  var ranked = FACET_META.slice().sort(function(a,b){ return scores[b.key] - scores[a.key]; });

  var lows = ranked.slice().reverse().filter(function(m){ return scores[m.key] <= 2; }).slice(0,5);
  function coverList(list, empty){
    if (!list.length) return '<p class="fr-facet-desc">' + empty + '</p>';
    return '<div class="fr-cover-list">' + list.map(function(m){
      return '<div class="fr-cover-item"><b>' + esc(m.name) + '</b>' +
             '<span class="fr-facet-desc">' + esc(FACTOR[m.factor].name) + '</span>' +
             '<span class="fr-chip" style="background:' + FACTOR[m.factor].color + '">' +
             scores[m.key] + '</span></div>';
    }).join('') + '</div>';
  }
  // ---- 5因子の五角形（全体像）----
  // ⚠ 値は必ず「30項目の平均」から出す（code の5桁は使わない）。
  //   このレポートは30項目が主役なので、下の30項目マップと必ず一致していないと
  //   「五角形は全部ふつうなのに、30項目マップでは感受性が高い」という矛盾が起きる。
  //   （2026-07-31に検証で実際に発生。code=33333 と facets がずれていたため）
  function factorScore(f) {
    var list = FACET_META.filter(function(m){ return m.factor === f; });
    var sum = list.reduce(function(a, m){ return a + scores[m.key]; }, 0);
    return Math.round(sum / list.length * 10) / 10;   // 小数第1位まで（例 4.3）
  }
  // その因子の6項目が「どこからどこまで散らばっているか」（平均だけだと中身の違いが消えるため）
  function factorRange(f) {
    var vs = FACET_META.filter(function(m){ return m.factor === f; })
                       .map(function(m){ return scores[m.key]; });
    return { min: Math.min.apply(null, vs), max: Math.max.apply(null, vs) };
  }
  var pentaHtml = (function(){
    var CX = 150, CY = 140, R = 92;           // 中心と半径
    var order = DISPLAY_ORDER;                 // O→C→E→A→N（表示順と合わせる）
    var pt = function(i, r){                   // i番目の軸の、中心からrの位置
      var ang = -Math.PI / 2 + i * 2 * Math.PI / 5;
      return [CX + Math.cos(ang) * r, CY + Math.sin(ang) * r];
    };
    var poly = function(r){
      return order.map(function(_, i){ return pt(i, r).map(function(n){ return n.toFixed(1); }).join(','); }).join(' ');

    var s = '<svg viewBox="0 0 300 285" role="img" aria-label="5つの性格の五角形">';

    });
    // 軸
    order.forEach(function(_, i){
      var p = pt(i, R);
      s += '<line class="fr-penta-axis" x1="' + CX + '" y1="' + CY +

    //   1枚の図に2つの情報を重ねると読みにくいので、中身は下の棒グラフで見せる
    var rad = function(v){ var r = R * (v - 1) / 4; return r < R * 0.06 ? R * 0.06 : r; };
    var vals = order.map(function(f){ return factorScore(f); });
    var area = order.map(function(_, i){
      return pt(i, rad(vals[i])).map(function(n){ return n.toFixed(1); }).join(',');

    s += '<polygon class="fr-penta-area" points="' + area + '"></polygon>';

    var widest = order.map(function(f){

      var info = FACTOR[f];

      FACET_META.filter(function(m){ return m.factor === f; }).forEach(function(m){

          bar = '<span class="fr-fbars-bar" style="left:50%;width:' + (off * 25) +

        }
        barsHtml += '<div class="fr-fbars-row">' +
          '<span class="fr-fbars-name">' + esc(m.name) + '</span>' +
          '<div class="fr-fbars-track"><span class="fr-fbars-center"></span>' + bar + '</div>' +
          '<span class="fr-fbars-score">' + sc + '</span></div>';
      });
      barsHtml += '</div>';
    });
    barsHtml += '</div>';

    return '<div class="fr-penta">' + s + '</div>' +
      '<p class="fr-penta-caption">この5つは、それぞれ6つの項目でできています。' +
      'その中身が下の棒グラフで、<b>まん中の線が「ふつう（3）」</b>。線から離れているほど、' +
      'その項目があなたらしさとして強く出ています。' + spreadLine +

  var spreadWord = spread >= 40 ? 'あなたは、項目ごとの差がはっきり出ているタイプです。'
                 : spread >= 20 ? 'あなたは、強い項目と控えめな項目がほどよく分かれています。'
                 : 'あなたは、どの項目もまん中寄りで、極端に偏らないタイプです。';

  // 表紙：五角形（全体像）→ その下に性格ごとの6本の棒（中身）→ 強い5つ・控えめな5つ

  //   （2026-08-01・準也さん案「五角形の後ろに棒グラフを6本並べる」に一本化）
  html += '<div class="report-card">' +
    '<p class="report-card-title">まず、5つの性格の全体像</p>' +

      '<div class="fr-cover-col"><h3>強く出ている項目</h3>' + coverList(tops, '4以上の項目はありません') + '</div>' +

  // ---- 読み方ガイド ----
  html += '<div class="report-card fr-guide">' +

    '<div class="fr-scale">' +
      '<span>1 かなり弱い</span><span>2 やや弱い</span><span>3 ふつう</span>' +

    '<p class="fr-facet-desc" style="margin-top:10px">' +

    var hi = list.slice().sort(function(a,b){ return scores[b.key] - scores[a.key]; })[0];

    var diff = scores[hi.key] - scores[lo.key];
    if (diff >= 2) {
      // 開きを目で見せる（左＝低い項目、右＝高い項目。間の距離が「その人の中の開き」）
      var gapFig =
        '<div class="fr-gapfig">' +
          '<div class="fr-gapfig-row">' +
            '<span class="fr-gapfig-label">' + esc(lo.name) + '</span>' +
            '<div class="fr-gapfig-track">' +
              '<span class="fr-gapfig-fill" style="left:' + ((scores[lo.key]-1)/4*100) +
                '%;width:' + (diff/4*100) + '%;background:' + info.color + '"></span>' +

          '</div>' +
          '<p class="fr-gapfig-cap">同じ' + esc(info.name) + 'の中で、' + diff + '段階ぶん開いています</p>' +
        '</div>';
      html += '<div class="fr-gap">' + gapFig +

        '<b>' + esc(lo.name) + '</b>が' + scores[lo.key] + 'と開いています。' +

        '「' + esc(hi.name) + 'は強いけれど' + esc(lo.name) + 'はそうでもない」——' +

    }
    html += '</div>';
  });

  // ---- クロス分析章：愛着スタイル×30項目（2026-08-02・正本＝plans/【設計】クロス分析第1弾） ----
  // 表示ルール（裁定済み）：該当パーツは全部出す・得点順・上位2本は開いた状態・3本目以降は折りたたみ
  var ATT_JA = { secure: '安定型', anxious: '不安型', avoidant: '回避型', fearful: '恐れ型' };

    1: '根拠：理論的に整合する組み合わせです（項目単位の研究は発展途上）'
  };
  function crossParas(t){

    }).join('');

  var HSP_JA = { high: 'HSP高め', low: 'HSP低め' };
  var RI_JA = { R: '現実型', I: '研究型', A: '芸術型', S: '社会型', E: '企業型', C: '慣習型' };
  var IMPDOM_JA = { perfectionist: '完璧主義型', superhero: 'スーパーヒーロー型', naturalGenius: '天才型',
                    soloist: '単独行動型', expert: '専門家型' };
  var EQ_JA = { very_high: 'EQかなり高め', high: 'EQ高め', average: 'EQ平均的', growth: 'EQ成長段階' };
  var EQW_JA = { awareness: '自己認識', regulation: '自己管理', motivation: '動機', empathy: '共感', social: '社会的スキル' };

  var MIND_JA = { growth: '成長マインドセット', fixed: '固定マインドセット' };
  var SDT_JA = { autonomy: '自律が燃料', competence: '上達が燃料', relatedness: 'つながりが燃料' };
  var LOVE_JA = { eros: '情熱型', ludus: '遊び型', storge: '友情型', pragma: '現実型', mania: '執着型', agape: '献身型' };
  var VAL_JA = { achievement: '達成', security: '安全', 'self-direction': '自律', stimulation: '刺激', hedonism: '快楽',
                 power: '権力', benevolence: '思いやり', universalism: '公正', conformity: '協調', tradition: '伝統' };
  var CROSS_TESTS = [
    { taken: !!attKey, name: attKey ? '愛着スタイル（' + ATT_JA[attKey] + '）' : '愛着スタイル', label: '愛着スタイル診断（12問）', href: 'attachment.html' },
    { taken: hspTotal !== null, name: 'HSP', label: 'HSP診断', href: 'hsp.html' },
    { taken: !!(impData && impData.severityLevel), name: 'インポスター', label: 'インポスター診断', href: 'impostor.html' },
    { taken: !!(eqData && (eqLv || eqWk)), name: 'EQ', label: 'EQ診断', href: 'eq.html' },
    { taken: !!dtS, name: 'ダークトライアド', label: 'ダークトライアド診断', href: 'dark-triad.html' },
    { taken: locusTaken, name: '統制の所在', label: '統制の所在診断', href: 'locus.html' },
    { taken: mindTaken, name: 'マインドセット', label: 'マインドセット診断', href: 'mindset.html' },
    { taken: !!sdtKey, name: '動機（SDT）', label: '動機づけ診断', href: 'sdt.html' },
    { taken: !!loveKey, name: '恋愛スタイル', label: '恋愛スタイル診断', href: 'love.html' },
    { taken: !!valKey, name: '価値観', label: '価値観診断', href: 'schwartz.html' },
    { taken: hexRaw !== null, name: 'HEXACO', label: 'HEXACO診断（200問）', href: 'hexaco.html' },
    { taken: !!riTop, name: 'RIASEC職業興味', label: 'RIASEC職業興味診断', href: 'riasec.html' }
  ];
  var anyTest = attKey || hspLv || impSev || impDom || eqLv || eqWk || dtS ||
                locusKey || mindKey || sdtKey || loveKey || valKey || hexLv || riTop;
  html += '<div class="report-card">' +
    '<p class="report-card-title">クロス分析：心理学テスト × あなたの30項目</p>';
  if (!anyTest) {
    html += '<p class="report-card-note">別の心理学テストと重ねて読む、このレポートだけの章です</p>' +
      '<p class="report-factor-text">無料の<b>愛着スタイル診断</b>（12問・約2分）やHSP・インポスター・EQ・ダークトライアドの各診断を' +
      'この端末で受けると、その結果とあなたの30項目の点数を重ねた、あなた専用のクロス分析がここに追加されます。</p>' +
      '<p style="text-align:center;margin:10px 0 4px;"><a class="fr-back" href="attachment.html">愛着スタイル診断を受ける →</a>' +
      '　<a class="fr-back" href="hsp.html">HSP診断を受ける →</a></p>';
  } else if (!data._cross) {
    html += '<p class="report-card-note">別の心理学テストと重ねて読む、このレポートだけの章です</p>' +
      '<p class="fr-facet-desc">クロス分析を読み込めませんでした。時間をおいて、もう一度お試しください。</p>';
  } else {
    var cx = data._cross;
    var takenNames = [];
    CROSS_TESTS.forEach(function(t){ if (t.taken) takenNames.push(t.name); });
    html += '<p class="report-card-note">' + takenNames.join('・') + ' の結果と、30項目の点数が交差する場所だけを書いた、あなた専用の分析です</p>' +
      '<p class="fr-facet-desc" style="margin-bottom:12px">この章は、国際標準の30の下位尺度（IPIP-NEO-120と同じ構成）に、' +
      'あなたが受けた各心理学診断の測定結果を重ねています。</p>';
    var introList = cx.intros || (cx.intro ? [{ test: 'att', body: cx.intro }] : []);
    introList.forEach(function(it, k){
      if (k > 0) html += '<div style="height:10px"></div>';
      html += crossParas(it.body);
    });
    cx.parts.forEach(function(p, i){
      var meta = null;
      for (var j = 0; j < FACET_META.length; j++) if (FACET_META[j].key === p.facet) meta = FACET_META[j];
      var fname = meta ? meta.name : (p.facet || '');
      var matBits = [], headBits = [], testCnt = 0;
      if (p.facet) {
        matBits.push('あなたの「' + fname + '」＝' + scores[p.facet] + '点');
        headBits.push('「' + fname + '」が' + (p.dir === 'high' ? '高い' : '低い'));
        testCnt++;
      }
      if (p.type) {
        matBits.push('愛着診断「' + ATT_JA[p.type] + '」' +
          (attData && attData.anxiety ? '（不安軸' + attData.anxiety + '・回避軸' + attData.avoidance + '）' : ''));
        headBits.push(ATT_JA[p.type]); testCnt++;
      }
      if (p.hsp) {
        matBits.push('HSP診断＝' + hspTotal + '点（' + (p.hsp === 'high' ? '高め' : '低め') + '）');
        headBits.push(HSP_JA[p.hsp]); testCnt++;
      }
      if (p.imp || p.impdom) {
        if (p.imp) matBits.push('インポスター診断＝' + (p.imp === 'high' ? '強め' : p.imp));
        if (p.impdom) matBits.push('インポスター優位タイプ「' + (IMPDOM_JA[p.impdom] || p.impdom) + '」');
        headBits.push(p.impdom ? 'インポスター' + (IMPDOM_JA[p.impdom] || '') : 'インポスター強め');
        testCnt++;
      }
      if (p.eq || p.eqw) {
        if (p.eq) matBits.push('EQ診断＝' + (EQ_JA[p.eq] || p.eq));
        if (p.eqw) matBits.push('EQの伸びどころ＝' + (EQW_JA[p.eqw] || p.eqw));
        headBits.push(p.eq ? (EQ_JA[p.eq] || 'EQ') : 'EQ伸びどころ「' + (EQW_JA[p.eqw] || '') + '」');
        testCnt++;
      }
      if (p.narc) { matBits.push('ナルシシズム＝' + (dtS ? dtS.nPct + '%' : '') + '（' + (p.narc === 'high' ? '高め' : '低め') + '）');
        headBits.push('ナルシシズム' + (p.narc === 'high' ? '高め' : '低め')); testCnt++; }
      if (p.mach) { matBits.push('マキャベリズム＝' + (dtS ? dtS.mPct + '%' : '') + '（' + (p.mach === 'high' ? '高め' : '低め') + '）');
        headBits.push('マキャベリズム' + (p.mach === 'high' ? '高め' : '低め')); testCnt++; }
      if (p.psy) { matBits.push('サイコパシー傾向＝' + (dtS ? dtS.pPct + '%' : '') + '（' + (p.psy === 'high' ? '高め' : '低め') + '）');
        headBits.push('サイコパシー傾向' + (p.psy === 'high' ? '高め' : '低め')); testCnt++; }
      if (p.locus) { matBits.push('統制の所在＝「' + (LOCUS_JA[p.locus] || p.locus) + '」');
        headBits.push(LOCUS_JA[p.locus] || p.locus); testCnt++; }
      if (p.mind) { matBits.push('マインドセット＝「' + (MIND_JA[p.mind] || p.mind) + '」');
        headBits.push(MIND_JA[p.mind] || p.mind); testCnt++; }
      if (p.sdtk) { matBits.push('動機タイプ＝「' + (SDT_JA[p.sdtk] || p.sdtk) + '」');
        headBits.push(SDT_JA[p.sdtk] || p.sdtk); testCnt++; }
      if (p.lovek) { matBits.push('恋愛スタイル＝「' + (LOVE_JA[p.lovek] || p.lovek) + '」');
        headBits.push('恋愛' + (LOVE_JA[p.lovek] || p.lovek)); testCnt++; }
      if (p.val) { matBits.push('最上位の価値観＝「' + (VAL_JA[p.val] || p.val) + '」');
        headBits.push('価値観「' + (VAL_JA[p.val] || p.val) + '」'); testCnt++; }
      if (p.hexh) { matBits.push('HEXACO正直さ-謙虚さ＝' + (hexRaw !== null ? hexRaw.toFixed(1) : '') +
          '（' + (p.hexh === 'high' ? '高め' : '低め') + '）');
        headBits.push('正直さ-謙虚さ' + (p.hexh === 'high' ? '高め' : '低め')); testCnt++; }
      if (p.ri) { matBits.push('RIASEC職業興味＝トップ「' + (RI_JA[p.ri] || p.ri) + '」' +
          (riData && riData.scores && riData.scores.code ? '（コード' + riData.scores.code + '）' : ''));
        headBits.push('職業興味「' + (RI_JA[p.ri] || p.ri) + '」'); testCnt++; }
      var mat = '材料：' + matBits.join(' × ');
      var inner = '<div class="fr-cross-meta"><span>' + esc(mat) + '</span>' +
        '<span>' + esc(CROSS_NOTE[p.science] || CROSS_NOTE[1]) + '</span></div>' + crossParas(p.body);
      var head = p.title ? p.title : headBits.join(' × ');
      if (testCnt >= 3) head = '★3テスト一致：' + head;
      if (i < 2) {
        html += '<div class="fr-facet"><div class="fr-facet-head">' +
          '<span class="fr-facet-name">' + esc(head) + '</span>' +
          (meta ? '<span class="fr-facet-score" style="background:' + FACTOR[meta.factor].color + '">' +
            scores[p.facet] + '</span>' : '') +
          '</div>' + inner + '</div>';
      } else {
        html += '<details class="fr-cross-fold"><summary>' + esc(head) + '</summary>' + inner + '</details>';
      }
    });
    if (!cx.parts.length) {
      html += '<p class="fr-facet-desc" style="margin-top:10px">30項目の点数がまん中寄りのため、今回は追加の各論はありません。' +
        'あなたの場合は上の総論が中心になります。</p>';
    }
    var invite = [];
    CROSS_TESTS.forEach(function(t){
      if (!t.taken) invite.push('<a class="fr-back" href="' + t.href + '">' + t.label + ' →</a>');
    });
    if (invite.length) {
      html += '<p class="fr-facet-desc" style="margin-top:12px">ほかの心理学診断を受けると、この章の交差点が増えます（3つ揃うと「★3テスト一致」の分析も出ます）：<br>' +
        invite.join('　') + '</p>';
    } else {
      html += '<p class="fr-facet-desc" style="margin-top:12px">あなたは対応する診断をすべて受けています。新しいテストとのクロス分析も、この章に順次追加していきます。</p>';
    }
  }
  html += '</div>';

  // ---- まとめ：いちばんあなたらしい3つ（3から離れている順） ----
  var far = FACET_META.slice().sort(function(a,b){
    var da = Math.abs(scores[a.key] - 3), db = Math.abs(scores[b.key] - 3);
    if (db !== da) return db - da;
    return scores[b.key] - scores[a.key];
  }).slice(0,3);
  html += '<div class="report-card">' +
    '<p class="report-card-title">30項目の中で、いちばんあなたらしい3つ</p>' +
    '<p class="report-card-note">まん中（3）からいちばん離れている項目です</p>' +
    '<div class="fr-top3">' + far.map(function(m, i){
      var s = scores[m.key];
      var dir = s >= 4 ? '強く出ています' : (s <= 2 ? '控えめです' : 'まん中あたりです');
      return '<div class="fr-top3-item"><div class="fr-top3-rank">' + (i+1) + '</div>' +
        '<div class="fr-top3-body"><b>' + esc(m.name) + '</b>' +
        '<span class="fr-facet-desc">（' + esc(FACTOR[m.factor].name) + '）</span><br>' +
        esc(m.desc) + '——ここが <b>' + s + '</b>。30項目の中でも、' + dir + '。</div></div>';
    }).join('') + '</div></div>';

  // ---- AI持ち出し（2026-08-03 気づかせ計画柱③・課金＝説明文まで全部渡す）----
  // 準也さん裁定：無料は数字とプロンプトのみ／このレポートを開いた人（課金導線通過者）だけ全文を持ち出せる
  if (!isSample) {
    html += '<div class="report-card" style="border:1px solid rgba(139,92,246,0.4)">' +
      '<p class="report-card-title">専用AIカウンセラー <span style="font-size:0.72em;background:rgba(139,92,246,0.25);' +
      'padding:2px 10px;border-radius:999px;vertical-align:middle">30項目詳細レポートの特典</span></p>' +
      '<p class="report-card-note">このレポートの全文（30項目の解説＋クロス分析＝約1.5万字）を、AIに渡せる形でコピーします。' +
      '貼り付けた先のAIは、この分析を土台にあなたの相談に乗る——専用カウンセラーになります。</p>' +
      '<p class="report-card-note" style="margin-top:6px">使い方：<b>①</b> 下のボタンで全文をコピー → ' +
      '<b>②</b> ChatGPTやClaudeのチャット欄に貼り付け → <b>③</b> 続けて相談したいことを書く</p>' +
      '<div class="ai-mode-choice" id="frAiMode">' +
      '<p class="report-card-note" style="font-weight:700;margin-bottom:6px">AIにどう相談したいですか</p>' +
      '<div class="ai-mode-btns">' +
      '<button type="button" class="ai-mode-btn" data-mode="listen">まず聞いてほしい</button>' +
      '<button type="button" class="ai-mode-btn on" data-mode="both">聞いたうえで、考えも聞きたい（おすすめ）</button>' +
      '<button type="button" class="ai-mode-btn" data-mode="answer">答えがほしい</button>' +
      '</div>' +
      '<p class="report-card-note" style="margin-top:6px">会話の途中でも「聞くだけでいい」「答えがほしい」と言えば切り替わります。</p>' +
      '</div>' +
      '<p style="text-align:center;margin:12px 0 4px">' +
      '<button id="frAiCopy" style="background:#8b5cf6;color:#fff;border:none;padding:12px 22px;border-radius:12px;' +
      'font-weight:700;font-size:0.95rem;cursor:pointer">全文をコピーして、AIに連れて行く</button></p>' +
      '<p id="frAiCopyDone" class="fr-facet-desc" style="text-align:center;display:none">' +
      'コピーしました。AIのチャット欄に貼り付けて、そのあとに相談したいことを書いてください。</p></div>';
  }

  if (isSample) {
    html += '<p style="text-align:center"><a class="fr-back" href="quiz.html?v=120">' +
      '120問版を受けて、自分のレポートを作る →</a></p>';
  } else {
    html += '<p style="text-align:center"><a class="fr-back" href="result.html?v=120' +
      (typeCode ? '&code=' + encodeURIComponent(typeCode) : '') +
      (gender ? '&gender=' + encodeURIComponent(gender) : '') +
      (facets ? '&facets=' + encodeURIComponent(facets) : '') +
      '">← 診断結果に戻る</a></p>';
  }

  box.innerHTML = html;

  // 相談のしかた3択（2026-08-18・マイページと設定を共有）
  var frAiMode = 'both';
  try { frAiMode = localStorage.getItem('bigfive_ai_mode') || 'both'; } catch (e) {}
  if (['listen','both','answer'].indexOf(frAiMode) < 0) frAiMode = 'both';
  function frPaintAiMode(){
    var bs = document.querySelectorAll('#frAiMode .ai-mode-btn');
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].getAttribute('data-mode') === frAiMode) bs[i].classList.add('on');
      else bs[i].classList.remove('on');
    }
  }
  (function(){
    var bs = document.querySelectorAll('#frAiMode .ai-mode-btn');
    for (var i = 0; i < bs.length; i++) {
      bs[i].onclick = function(){
        frAiMode = this.getAttribute('data-mode');
        try { localStorage.setItem('bigfive_ai_mode', frAiMode); } catch (e) {}
        frPaintAiMode();
      };
    }
    frPaintAiMode();
  })();

  // AI持ち出しボタンの動作（全文整形→クリップボード）
  var aiBtn = document.getElementById('frAiCopy');
  if (aiBtn) aiBtn.addEventListener('click', function(){
    var t = buildAiFullText(data, frAiMode);
    function done(){
      var d = document.getElementById('frAiCopyDone');
      if (d) d.style.display = 'block';
      aiBtn.textContent = 'コピーしました ✓';
      try {
        if (localStorage.getItem('dev_nocount') !== '1' && !localStorage.getItem('counted_paid_ai_copy')) {
          localStorage.setItem('counted_paid_ai_copy', '1');
          fetch('/count/hit?e=paid_ai_copy', { method: 'POST', keepalive: true }).catch(function(){});
        }
      } catch (e) {}
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done).catch(function(){ fallbackCopy(t); done(); });
    } else { fallbackCopy(t); done(); }
  });
  function fallbackCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  // 型を細かく指定すると毎回同じ返事になりループするため、禁止3つだけ残して自由に会話させる（2026-08-18）
  var FR_AI_HEAD = [
    'あなたは性格心理学（ビッグファイブ理論など）に詳しい、親身な相談相手です。',
    '以下は、私が性格診断サイトで受けた120問版ビッグファイブ診断の「30項目 詳細レポート」の全文です。',
    '私の30項目の点数と、その解説、そして他の心理学テストとの掛け合わせ分析（クロス分析）が含まれています。',
    'この分析を土台に、このあと私が書く質問や相談に答えてください。',
    '性格は「傾向」であって決めつけではない前提で、断定しすぎずにお願いします。',
    '',
    '最初の返事では、この分析から読み取れる「私の日常で起きていそうな場面」を1つ、仮説として言い当てて、合っているか私に聞いてください。分析の読み上げや要約はしないでください（私はすでに読んでいます）。',
    ''
  ];
  var FR_AI_MODE_LINE = {
    listen: '私は今、答えより話を聞いてほしい気分です。アドバイスは私が求めたときだけにしてください。',
    both: '聞くだけで終わらせず、あなたの考えも聞かせてください。',
    answer: '私は答えがほしいタイプなので、結論を先延ばしにはしないでください。'
  };
  var FR_AI_TAIL = [
    '・一度出した提案は二度出さない（同じ話に戻さない）',
    '・私の答えで返事が変わらない質問はしない',
    '・毎回を質問で終わらせない。話が尽きたら区切ってよい',
    '',
    '箇条書きは使わず、話し言葉で。深刻な悩み（心身の不調が続くなど）だと感じたら、専門機関への相談も勧めてください。',
    '',
    '【30項目の点数と解説（各1〜5点）】'
  ];
  function buildAiFullText(data, mode){
    var line = FR_AI_MODE_LINE[mode] || FR_AI_MODE_LINE.both;
    var L = FR_AI_HEAD.concat(
      ['そのあとは決まった型を使わず、ふつうの会話として自然に話してください。' + line + '守ってほしいのは次の3つだけです。'],
      FR_AI_TAIL);
    FACET_META.forEach(function(m){
      var s = scores[m.key];
      var body = (data[m.key] || {})[String(s)] || '';
      L.push('■ ' + m.name + '（' + FACTOR[m.factor].name + '）: ' + s + '点');
      if (body) L.push(body);
    });
    var cx = data._cross;
    if (cx && ((cx.parts && cx.parts.length) || (cx.intros && cx.intros.length))) {
      L.push('');
      L.push('【クロス分析（他の心理学テストとの掛け合わせ）】');
      (cx.intros || []).forEach(function(it){ L.push(it.body); L.push(''); });
      (cx.parts || []).forEach(function(p){
        L.push('■ ' + (p.title ? p.title : 'クロス分析'));
        L.push(p.body);
        L.push('');
      });
    }
    L.push('【分析はここまで】このあとに、私の相談を書きます。');
    return L.join('\n');
  }

  // ---- 計測（1端末1回だけ・設計書§3。dev_nocount=1 のときは数えない） ----
  // サンプル閲覧は paid_report_view に混ぜない（レポート到達数が水増しされるため別イベント）
  try {
    var evName = isSample ? 'paid_sample_view' : 'paid_report_view';
    if (localStorage.getItem('dev_nocount') !== '1' &&
        !localStorage.getItem('counted_' + evName)) {
      localStorage.setItem('counted_' + evName, '1');
      fetch('/count/hit?e=' + evName, { method: 'POST', keepalive: true }).catch(function(){});
    }
  } catch (e) {}
}
</script>
<script src="nav.js"></script>
</body>
</html>
