<!--
  準也さん専用の計測ダッシュボード（2026-08-07新設）
  ★このページは公開サイトに置いてあるが、次の3つで見つからないようにしている：
     ①ファイル名が推測できない ②noindexで検索に載せない ③sitemapに入れず、どこからもリンクしない
     （robots.txtには書かない。書くと逆にURLが公開されるうえ、クロールされずnoindexが読まれなくなる）
  ★計測を汚さないため、nav.js など他のJSは一切読み込まない完全独立ページ。
    このページを何回開いてもカウンターは1も増えない。
  データ元＝/count/daily（毎朝5時のスナップショット）＋/count/stats（今この瞬間の累計）
-->
<style>

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin:11px 0;}

  .summary b{color:var(--accent);}
  .summary .bad{color:var(--bad);}

  /* 漏斗 */
  .fstep{display:flex;align-items:center;gap:9px;margin:4px 0;}
  .fbarwrap{flex:1;min-width:0;}
  .fbar{height:36px;border-radius:6px;display:flex;align-items:center;padding:0 11px;
        color:#fff;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;
        min-width:104px;}
  .frate{width:58px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0;}
  .fnote{font-size:12.5px;color:var(--bad);padding:1px 0 7px 4px;font-weight:700;}
  .flabel{font-size:12.5px;color:var(--sub);padding-left:2px;}

  /* グラフ */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px;}
  .tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;
       font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit;}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
  .chart{width:100%;height:190px;display:block;}
  .legend{font-size:12px;color:var(--sub);margin-top:4px;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:3px;}

  /* タイル */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
  .tile .t{font-size:12px;color:var(--sub);line-height:1.45;min-height:2.9em;}
  .tile .v{font-size:23px;font-weight:700;line-height:1.25;}
  .tile .u{font-size:11.5px;color:var(--sub);font-weight:400;}
  .tile .d{font-size:12.5px;font-weight:700;margin-top:1px;}
  .up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--sub)}

  /* 毎朝の自動レポート */
  .report{background:#fffdf6;border:2px solid #e3c86b;border-radius:12px;padding:15px 16px;margin:0 0 14px;}
  .rtitle{font-size:12.5px;color:#8a6d1f;font-weight:700;margin-bottom:4px;}
  .rhead{font-size:16.5px;font-weight:700;line-height:1.55;margin-bottom:8px;}

  .rwatch ul{margin:5px 0 0;padding-left:20px;} .rwatch li{margin:3px 0;}

  .err{background:#fdecea;border:1px solid #f3b7b1;color:#8a231b;border-radius:10px;padding:14px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;}

/* ============================================================
   2. 計算のしかた
   ------------------------------------------------------------
   カウンターは累計なので、隣り合う記録日の差＝その期間の実績。
   記録が飛んでいる日（手記録の時代は毎日ではない）は、
   期間の合計を日数で割って各日に均等に配る＝「推定値」として薄い色で描く。
   ★リセット直後は差が負になる。負は無効として捨てる（無意味な数字を出さない）。
   ============================================================ */
function dayGap(a, b){
  return Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z')) / 86400000);
}
// 日本時間の今日（端末の時計が日本以外に設定されていても日本の日付になる）
function jstToday(){
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}

function dailySeries(dates, values){
  var out = new Array(dates.length).fill(null);
  var prev = -1;
  for (var i = 0; i < values.length; i++){
    if (values[i] === null || values[i] === undefined) continue;
    if (prev >= 0){
      var diff = values[i] - values[prev];
      var gap  = dayGap(dates[prev], dates[i]);
      if (diff >= 0 && gap > 0){
        var per = diff / gap;
        for (var k = prev + 1; k <= i; k++){
          out[k] = { v: per, est: gap > 1 };
        }
      }
    }
    prev = i;
  }
  return out;
}

// 合成指標（10問＋30問＋120問の完走）
function seriesOf(counters, key){
  if (key === '__quiz_all'){
    var a = counters['quiz_complete_10']  || [];
    var b = counters['quiz_complete_30']  || [];
    var c = counters['quiz_complete_120'] || [];
    var n = Math.max(a.length, b.length, c.length);
    var out = [];
    for (var i = 0; i < n; i++){
      if (a[i] == null || b[i] == null || c[i] == null) { out.push(null); }
      else { out.push(a[i] + b[i] + c[i]); }
    }
    return out;
  }
  return counters[key] || [];
}

/* ★日付を連続させる
   /count/daily が返す dates は「記録がある日」だけなので、記録が飛んだ日は配列に存在しない。
   そのままだと「配列の隣＝1日後」という前提が崩れ、増分を配る回数が足りず合計が減る
   （2026-08-07の検算で result_view の合計が 2,404 → 2,265.5 に目減りして発覚）。 */
function nextDay(s){
  return new Date(Date.parse(s + 'T00:00:00Z') + 86400000).toISOString().slice(0,10);
}
function fillDates(dates){
  if (!dates.length) return [];
  var out = [], cur = dates[0], last = dates[dates.length-1], guard = 0;
  while (cur <= last && guard++ < 2000){ out.push(cur); cur = nextDay(cur); }
  return out;
}

/* 直近n日の合計。★その期間に記録が1つも無ければ null を返す
   （0を返すと「先週は誰もやらなかった」という嘘になる。記録が無いのと0人は別物） */
function sumLast(series, n){
  var s = 0, cnt = 0, has = false;
  for (var i = series.length - 1; i >= 0 && cnt < n; i--){
    if (series[i]) { s += series[i].v; has = true; }
    cnt++;
  }
  return has ? s : null;
}
// その前のn日ぶんの合計（同じく、記録が無ければ null）
function sumPrev(series, n){
  var s = 0, cnt = 0, skipped = 0, has = false;
  for (var i = series.length - 1; i >= 0; i--){
    if (skipped < n) { skipped++; continue; }
    if (cnt >= n) break;
    if (series[i]) { s += series[i].v; has = true; }
    cnt++;
  }
  return has ? s : null;
}

function fmt(x){
  if (x === null || x === undefined || isNaN(x)) return '—';
  if (x >= 100) return Math.round(x).toLocaleString();
  if (x >= 10)  return (Math.round(x*10)/10).toString();
  return (Math.round(x*10)/10).toString();
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ============================================================
   3. 描画
   ============================================================ */
// 最初に出すグラフは result_view（7月からの過去データがそろっている唯一の系列。
// __quiz_all は8/1以降しか無く、開いた瞬間に棒が数本しか出ず「壊れている」ように見える）
// stats＝今この瞬間の累計（/count/stats）。日別記録は毎朝5時なので、これが無いと
// 「昨日の朝までの数字」しか見られない＝今日ぶんが丸ごと見えなかった（2026-08-14に追加）
var STATE = { dates:[], counters:{}, series:{}, chartKey:'result_view', stats:null, statsAt:null };

// その項目の日本語名（合成指標の __quiz_all も引けるようにする）
function labelOf(key){
  if (key === '__quiz_all') return '診断の完走（10問＋30問＋120問）';
  return LABELS[key] || key;
}
// 一言まとめ用の呼び名。タイルに書いてある名前（例「¥980の画面まで来た人」）を優先する。
// 一覧表の名前は仕組みに寄せてあり（例「試し読み『続きを全部読む』」）、まとめ文には向かない
function shortLabelOf(key){
  for (var i = 0; i < TILES.length; i++){
    if (TILES[i].key === key) return TILES[i].label.replace(/^　└ /, '');
  }
  return labelOf(key);
}
// 最後のスナップショット（＝いちばん新しい記録日）の累計値
function lastSnap(nm){
  var arr = STATE.counters[nm] || [];
  for (var i = arr.length - 1; i >= 0; i--){
    if (arr[i] !== null && arr[i] !== undefined) return arr[i];
  }
  return null;
}
// 今この瞬間の累計（statsが取れていないときは null）
function nowTotal(nm){
  if (!STATE.stats) return null;
  if (nm === '__quiz_all'){
    var a = STATE.stats['quiz_complete_10'], b = STATE.stats['quiz_complete_30'], c = STATE.stats['quiz_complete_120'];
    if (a == null || b == null || c == null) return null;
    return a + b + c;
  }
  return STATE.stats[nm] === undefined ? null : STATE.stats[nm];
}
// 最後の記録から今までに増えた数（リセット等で負になったら無効＝表示しない）
function sinceSnap(nm){
  var now = nowTotal(nm), snap = (nm === '__quiz_all')
    ? (function(){ var a=lastSnap('quiz_complete_10'), b=lastSnap('quiz_complete_30'), c=lastSnap('quiz_complete_120');
                   return (a==null||b==null||c==null) ? null : a+b+c; })()
    : lastSnap(nm);
  if (now === null || snap === null) return null;
  var d = now - snap;
  return d < 0 ? null : d;
}

function buildFunnel(f){
  var vals = f.steps.map(function(s){ return sumLast(STATE.series[s.key] || [], 7); });
  var top = (vals[0] !== null && vals[0] > 0) ? vals[0] : 1;
  // いちばん通過率が低い段を探す（2段目以降・記録が無い段は判定に入れない）
  var worst = -1, worstRate = 2;
  for (var i = 1; i < vals.length; i++){
    var r = (vals[i] !== null && vals[i-1] !== null && vals[i-1] > 0) ? vals[i] / vals[i-1] : null;
    if (r !== null && r < worstRate){ worstRate = r; worst = i; }
  }
  var h = '<div class="card"><div style="font-weight:700;margin-bottom:2px">' + esc(f.title) + '</div>'
        + '<div class="note" style="margin-bottom:9px">' + esc(f.note) + '（直近7日の合計）</div>';
  for (var i = 0; i < f.steps.length; i++){
    var w = (vals[i] !== null && top > 0) ? Math.max(9, Math.round(vals[i] / top * 100)) : 9;
    var rate = (i === 0 || vals[i] === null || vals[i-1] === null || vals[i-1] <= 0)
             ? null : vals[i] / vals[i-1];
    // ★安全装置：通過率が100%を超えたら率を出さない。
    //   「前の段より多い」＝その段は前の段の下流ではない（見返しなどで膨らむ）ということなので、
    //   率として見せると必ず誤解を招く。数字そのものは棒の中に出る。
    var rateOver = (rate !== null && rate > 1.05);
    if (rateOver) rate = null;
    var isWorst = (i === worst);
    var color = isWorst ? '#c1352b' : 'hsl(213,' + (52 - i*5) + '%,' + (42 + i*7) + '%)';
    var rcls = rate === null ? '' : (rate >= 0.6 ? 'up' : (rate >= 0.3 ? 'flat' : 'down'));
    h += '<div class="flabel">' + esc(f.steps[i].label) + '</div>'
       + '<div class="fstep"><div class="fbarwrap"><div class="fbar" style="width:' + w + '%;background:' + color + '">'
       + fmt(vals[i]) + '</div></div>'
       + '<div class="frate ' + rcls + '">' + (rate === null ? '' : Math.round(rate*100) + '%') + '</div></div>';
    if (rateOver){
      h += '<div class="note" style="padding:0 0 6px 4px">※前の段より多いため、通過率は出していません（この段は前の段の下流ではありません）</div>';
    }
    if (isWorst){
      h += '<div class="fnote">▲ ここがいちばん細い。ここを広げるのが一番効きます</div>';
    }
  }
  return h + '</div>';
}

function buildChart(){
  var s = STATE.series[STATE.chartKey] || [];
  var dates = STATE.dates;
  var n = Math.min(21, dates.length);
  var from = dates.length - n;
  var W = 700, H = 190, padL = 4, padB = 22, padT = 18;
  var max = 0;
  for (var i = from; i < dates.length; i++){ if (s[i] && s[i].v > max) max = s[i].v; }
  if (max <= 0) max = 1;
  var bw = (W - padL*2) / n;
  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  for (var i = from; i < dates.length; i++){
    var d = s[i];
    var x = padL + (i - from) * bw;
    var v = d ? d.v : 0;
    var bh = Math.max(d ? 2 : 0, (H - padB - padT) * (v / max));
    var y = H - padB - bh;
    var fill = !d ? '#e3e8ee' : (d.est ? '#a8c4e6' : '#2b5fa8');
    svg += '<rect x="' + (x+1.5) + '" y="' + y + '" width="' + (bw-3) + '" height="' + bh + '" fill="' + fill + '" rx="2"/>';
    if (d && (n <= 14 || (i - from) % 2 === 0)){
      svg += '<text x="' + (x + bw/2) + '" y="' + (y - 4) + '" font-size="10" fill="#5d6773" text-anchor="middle">'
           + fmt(d.v) + '</text>';
    }
    if ((i - from) % Math.ceil(n/7) === 0 || i === dates.length-1){
      svg += '<text x="' + (x + bw/2) + '" y="' + (H - 7) + '" font-size="10" fill="#7b8695" text-anchor="middle">'
           + dates[i].slice(5).replace('-','/') + '</text>';
    }
  }
  svg += '</svg>';

  var tabs = '<div class="tabs">';
  CHART_ITEMS.forEach(function(it){
    tabs += '<button class="tab' + (it.key === STATE.chartKey ? ' on' : '') + '" data-k="' + it.key + '">'
          + esc(it.label) + '</button>';
  });
  tabs += '</div>';

  /* ★2026-08-14追加：ボタンは7つしか置けないので、残り全部はプルダウンから選ぶ。
     ボタンを80個並べても選べないが、「グラフで見られるのが7項目だけ」では数字が足りない。 */
  var inTabs = {};
  CHART_ITEMS.forEach(function(it){ inTabs[it.key] = 1; });
  var sel = '<div style="margin:-4px 0 9px"><span class="note">ほかの数字をグラフで見る：</span> '
          + '<select id="chartSel" style="font-family:inherit;font-size:13px;padding:3px 5px;max-width:100%">'
          + '<option value="">選んでください</option>';
  GROUPS.forEach(function(g){
    var ks = g.keys.filter(function(k){ return STATE.counters[k] && !inTabs[k]; });
    if (!ks.length) return;
    sel += '<optgroup label="' + esc(g.title) + '">';
    ks.forEach(function(k){
      sel += '<option value="' + esc(k) + '"' + (k === STATE.chartKey ? ' selected' : '') + '>'
           + esc(labelOf(k).replace(/^　└ /, '')) + '</option>';
    });
    sel += '</optgroup>';
  });
  sel += '</select></div>';

  var head = '<div style="font-weight:700;margin-bottom:3px">'
           + esc(labelOf(STATE.chartKey).replace(/^　└ /, '')) + '（1日ごと・直近' + n + '日）</div>';

  return '<div class="card">' + tabs + sel + head + svg
       + '<div class="legend"><i style="background:#2b5fa8"></i>その日に記録した実測　'
       + '<i style="background:#a8c4e6"></i>記録が飛んだ期間を日数で割った推定　'
       + '<i style="background:#e3e8ee"></i>データなし</div></div>';
}

function buildTiles(){
  var h = '<div class="tiles">';
  TILES.forEach(function(t){
    var s = STATE.series[t.key] || [];
    var cur = sumLast(s, 7), prev = sumPrev(s, 7);
    var line;
    if (cur === null){
      line = '<div class="d flat">まだ記録がありません</div>';
    } else if (prev === null){
      // ★0と表示してはいけない（記録が無いだけで、実際に0人だったわけではない）
      line = '<div class="d flat">前の7日は記録なし</div>';
    } else {
      var df = cur - prev;
      var cls = Math.abs(df) < 0.5 ? 'flat' : (df > 0 ? 'up' : 'down');
      var mark = Math.abs(df) < 0.5 ? '±' : (df > 0 ? '▲ +' : '▼ ');
      line = '<div class="d ' + cls + '">' + mark + fmt(Math.abs(df)) + '　前の7日と比べて</div>';
    }
    h += '<div class="tile"><div class="t">' + esc(t.label) + '</div>'
       + '<div class="v">' + fmt(cur) + '<span class="u"> ' + (t.unit || '人') + '／7日</span></div>'
       + line + '</div>';
  });
  return h + '</div>';
}

/* ★2026-08-14追加：まる1日ぶんの実績を1行で出す
   毎朝6時にクラウドのClaudeが分析文を書く仕組みは動かない（クラウド側が
   bigfive.jr-genius.jp への通信を許可されておらず、数字を取りに行った時点で403で弾かれる。
   2026-08-07に4回試して4回とも同じ・8/08に停止）。
   その代わり、この画面を開いた時点で「前の日に何があったか」が必ず1行で分かるようにする。
   ★日付は必ず添える＝記録が飛んだ日があると「きのう」とは限らないため。 */
var DAY_KEYS = [
  {key:'__quiz_all',        label:'診断の完走', unit:'人'},
  {key:'quiz_complete_120', label:'120問',     unit:'人'},
  {key:'result_view',       label:'結果ページ', unit:'回'},
  {key:'paid_btn_click',    label:'¥980の画面', unit:'人'}
];

function yesterdayLine(){
  var dates = STATE.dates;
  if (dates.length < 2) return '';
  var day = dates[dates.length - 2];   // 最後の記録の1つ前＝「まる1日ぶん」が取れる区間の始まり
  var parts = [], est = false, any = false;
  DAY_KEYS.forEach(function(k){
    var s = STATE.series[k.key] || [];
    var v = s[s.length - 1];
    if (!v) return;
    any = true;
    if (v.est) est = true;
    parts.push(esc(k.label) + fmt(v.v) + k.unit);
  });
  if (!any) return '';
  return '<b>' + day.slice(5).replace('-', '/') + ' の1日</b>＝' + parts.join('・')
       + (est ? '<span class="note">（記録が飛んだ期間の推定を含みます）</span>' : '') + '。<br>';
}

function buildSummary(){
  var quiz = STATE.series['__quiz_all'] || [];
  var last = null;
  for (var i = quiz.length - 1; i >= 0; i--){ if (quiz[i]) { last = quiz[i]; break; } }
  var cur7 = sumLast(quiz, 7), prev7 = sumPrev(quiz, 7);

  // いちばん伸びた／落ちた指標を探す（前の7日に記録が無いものは比較しない）
  var bestName = null, bestRate = 0, worstName = null, worstRate = 0;
  SUMMARY_KEYS.forEach(function(key){
    var s = STATE.series[key] || [];
    var c = sumLast(s, 7), p = sumPrev(s, 7);
    if (c === null || p === null || p < 3) return;
    if (c > p){
      var r = (c - p) / p;
      if (r > bestRate){ bestRate = r; bestName = shortLabelOf(key); }
    } else if (c < p){
      var r2 = (p - c) / p;
      if (r2 > worstRate){ worstRate = r2; worstName = shortLabelOf(key); }
    }
  });

  var h = '<div class="summary">';
  h += yesterdayLine();
  h += 'この7日間で <b>診断を最後までやった人が' + fmt(cur7) + '人</b>';
  if (cur7 !== null && prev7 !== null){
    var diff = cur7 - prev7;
    h += '（前の7日より <b' + (diff >= 0 ? '' : ' class="bad"') + '>'
       + (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff)) + '人</b>）。';
  } else {
    h += '。<span class="note">（前の7日は記録が無いので比較できません）</span>';
  }
  if (bestName) h += '<br>いちばん伸びたのは <b>' + esc(bestName) + '</b>（+' + Math.round(bestRate*100) + '%）。';
  if (worstName) h += '<br>いちばん落ちたのは <span class="bad">' + esc(worstName) + '</span>（−' + Math.round(worstRate*100) + '%）。';
  h += '</div>';
  return h;
}

/* ★2026-08-14追加：最後の記録から今までに増えた数
   日ごとの記録は毎朝5時なので、それ以降に起きたことは、この画面のどこにも出ていなかった。
   /count/stats（今この瞬間の累計）と、最後の記録の差を出せば「今どうなっているか」が見える。 */
var NOW_KEYS = ['__quiz_all','quiz_complete_120','result_view','report_view',
                'paid_btn_click','paid_buy_click','gacha_feature_unlock','ai_profile_copy'];

function buildNow(){
  if (!STATE.stats || !STATE.dates.length) return '';
  var lastDate = STATE.dates[STATE.dates.length - 1];
  var hours = (STATE.statsAt - Date.parse(lastDate + 'T05:00:00+09:00')) / 3600000;
  var span = (hours <= 0 || isNaN(hours)) ? ''
           : (hours < 48 ? Math.max(1, Math.round(hours)) + '時間で'
                         : Math.round(hours / 24) + '日で');

  var h = '<div class="card"><div style="font-weight:700;margin-bottom:2px">'
        + 'サイトが始まってからの合計（今この瞬間）</div>'
        + '<div class="note" style="margin-bottom:9px">日ごとの記録は毎朝5時なので、'
        + '下のグラフや「直近7日」には<b>' + lastDate + ' の朝5時より後のぶんが入っていません</b>。'
        + 'この段だけが今この瞬間の数字です（小さい字＝朝5時の記録のあと' + span + '増えた数）。</div>'
        + '<div class="tiles">';
  NOW_KEYS.forEach(function(k){
    var inc = sinceSnap(k), total = nowTotal(k);
    // ★1行に収める（タイルの幅は140px。2行に折り返すと数字より説明が目立って読みにくい）
    var d = (inc === null) ? '<div class="d flat">—</div>'
          : (inc > 0 ? '<div class="d up">▲ +' + inc.toLocaleString() + '</div>'
                     : '<div class="d flat">まだ動きなし</div>');
    h += '<div class="tile"><div class="t">' + esc(labelOf(k)) + '</div>'
       + '<div class="v">' + (total === null ? '—' : total.toLocaleString()) + '</div>'
       + d + '</div>';
  });
  return h + '</div></div>';
}

function render(){
  var h = '';
  h += buildSummary();
  h += '<h2>今この瞬間の数字</h2>';
  h += buildNow();
  h += '<h2>どこで人が落ちているか</h2>';
  FUNNELS.forEach(function(f){ h += buildFunnel(f); });
  h += '<h2>1日ごとの動き</h2>';
  h += buildChart();
  h += '<h2>主な数字（直近7日の合計）</h2>';
  h += '<div class="note" style="margin:-3px 0 9px">※ ここに出るのは'
     + '<b>' + STATE.dates[STATE.dates.length-1] + ' の朝5時まで</b>の数字です'
     + '（それより後のぶんは上の「今この瞬間の数字」で見てください）。'
     + '「前の7日は記録なし」と出る項目は、そのカウンター自体を作ったのが最近で、'
     + '比べる相手のデータがまだ無いものです。</div>';
  h += buildTiles();

  /* 1行ぶんの中身（日本語名・今の累計・記録後の増分・直近7日・その前の7日）
     ★2026-08-14に列を2本増やした。今までは「昨日の朝までの累計」と「直近7日」の2つしか無く、
       今日ぶんも、先週との比較も、この表からは読めなかった。 */
  var lastDate = STATE.dates.length ? STATE.dates[STATE.dates.length - 1] : '';
  var sinceHead = lastDate ? lastDate.slice(5).replace('-', '/') + '朝〜今' : '記録後';

  function rowOf(nm){
    var total = nowTotal(nm);
    if (total === null) total = lastSnap(nm);   // 今の累計が取れない項目は最後の記録で代用
    var inc = sinceSnap(nm);
    var s7 = sumLast(STATE.series[nm] || [], 7);
    var p7 = sumPrev(STATE.series[nm] || [], 7);
    return '<tr><td>' + esc(LABELS[nm] || nm) + '</td>'
         + '<td>' + (total === null ? '—' : total.toLocaleString()) + '</td>'
         + '<td>' + (inc === null ? '—' : (inc > 0 ? '+' + inc.toLocaleString() : '0')) + '</td>'
         + '<td>' + fmt(s7) + '</td>'
         + '<td>' + fmt(p7) + '</td></tr>';
  }

  // 表に出す項目＝日別記録にあるもの ＋ 今の累計にしか無いもの（新設カウンターも必ず出る）
  var allKeys = {};
  Object.keys(STATE.counters).forEach(function(k){ allKeys[k] = 1; });
  if (STATE.stats) Object.keys(STATE.stats).forEach(function(k){ allKeys[k] = 1; });
  var nItems = Object.keys(allKeys).length;

  // ★既定で開く。閉じていると、この画面で見える数字が8個しか無いように見える
  h += '<details open><summary>すべての数字を見る（' + nItems + '項目）</summary>'
     + '<div class="card" style="overflow-x:auto">'
     + '<table><tr><th>項目</th><th>今の累計</th><th>' + esc(sinceHead) + '</th>'
     + '<th>直近7日</th><th>その前の7日</th></tr>';
  var shown = {};
  GROUPS.forEach(function(g){
    var rows = g.keys.filter(function(k){ return allKeys[k]; });
    if (!rows.length) return;
    h += '<tr><th colspan="5" style="background:#e6ecf3;text-align:left">' + esc(g.title) + '</th></tr>';
    rows.forEach(function(nm){ shown[nm] = 1; h += rowOf(nm); });
  });
  // 分類に入れ忘れたものがあれば最後に出す（項目が増えたときに落ちないように）
  var rest = Object.keys(allKeys).filter(function(k){ return !shown[k]; }).sort();
  if (rest.length){
    h += '<tr><th colspan="5" style="background:#e6ecf3;text-align:left">その他（分類していない項目）</th></tr>';
    rest.forEach(function(nm){ h += rowOf(nm); });
  }
  h += '</table></div></details>';

  document.getElementById('app').innerHTML = h;

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){ STATE.chartKey = b.getAttribute('data-k'); render(); });
  });
  var selEl = document.getElementById('chartSel');
  if (selEl){
    selEl.addEventListener('change', function(){
      if (!selEl.value) return;
      STATE.chartKey = selEl.value;
      render();
      // 選び直したグラフが画面に入るように、位置を合わせる
      var el = document.getElementById('chartSel');
      if (el && el.scrollIntoView) el.scrollIntoView({block:'center'});
    });
  }
}

/* ============================================================
   4. 読み込み
   ============================================================ */
/* 毎朝の自動レポートを読み込む（2026-08-07追加）
   毎朝6時にクラウドのClaudeが数字を分析し、POST /count/report で保存する。ここはその読み出し。
   ★Gitでなくデータベースに置く理由＝クラウド側のGitHub書き込み権限が確認できなかったこと、
     および毎日コミットが増えると手元のGit操作（rebase）が要るため。
   ★まだ無い日・読めない日は黙って何も出さない（画面を壊さない）。 */
function loadReport(){
  fetch('/count/report', {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rep){
      if (!rep || !rep.headline) return;
      /* ★いつ書いた文章かをはっきりさせる（2026-08-14追加）
         毎朝の自動作成は止まっているので、放っておくと何日も前の文章が
         「今朝の報告」という見出しで出続ける＝古い話を今日の話と読んでしまう。 */
      var age = rep.date ? dayGap(rep.date, jstToday()) : null;
      var title = (age === null || age <= 0) ? '今朝の報告' : age + '日前に書いた報告';
      var h = '<div class="report"><div class="rtitle">' + esc(title) + '　'
            + esc(rep.date || '') + '</div>'
            + '<div class="rhead">' + esc(rep.headline) + '</div>';
      (rep.body || []).forEach(function(p){ h += '<p>' + esc(p) + '</p>'; });
      if (rep.watch && rep.watch.length){
        h += '<div class="rwatch"><b>次に見るところ</b><ul>';
        rep.watch.forEach(function(w){ h += '<li>' + esc(w) + '</li>'; });
        h += '</ul></div>';
      }
      if (age !== null && age >= 1){
        h += '<div class="rwatch" style="color:#8a6d1f">この文章は<b>' + esc(rep.date) + 'に書いたもの</b>で、'
           + '今日のものではありません（毎朝の自動作成は止めてあります）。'
           + '<b>下の数字はすべて今日の最新です。</b>新しい読み解きが必要なときは、'
           + 'いつでも私に「数字を見て」と言ってください。</div>';
      }
      document.getElementById('report').innerHTML = h + '</div>';
    })
    .catch(function(){ /* 無くても平常運転 */ });
}

/* 今この瞬間の累計を取る（2026-08-14追加）
   ★取れなくても画面は壊さない＝その場合は今までどおり「最後の記録まで」の表示になる。 */
function loadStats(){
  return fetch(API_STATS, {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(s){
      if (s && typeof s === 'object'){ STATE.stats = s; STATE.statsAt = Date.now(); }
    })
    .catch(function(){ /* 無くても平常運転 */ });
}

function loadDaily(){
  fetch(API_DAILY, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('daily ' + r.status); return r.json(); })
    .then(function(d){
      STATE.dates = d.dates || [];
      STATE.counters = d.counters || {};
      if (!STATE.dates.length){
        document.getElementById('app').innerHTML =
          '<div class="err">まだ記録が1日もありません。毎朝5時の自動記録が動き出すのを待ってください。</div>';
        return;
      }

      // ★横軸を連続した日付にそろえる（記録が無い日も枠だけ作る）
      var filled = fillDates(STATE.dates);
      if (filled.length !== STATE.dates.length){
        var map = {};
        STATE.dates.forEach(function(dt, i){ map[dt] = i; });
        var nc = {};
        Object.keys(STATE.counters).forEach(function(k){
          var src = STATE.counters[k];
          nc[k] = filled.map(function(dt){
            return map[dt] === undefined ? null : src[map[dt]];
          });
        });
        STATE.counters = nc;
        STATE.dates = filled;
      }
      // 使う指標ぶんの日別データを先に作っておく
      var keys = {};
      CHART_ITEMS.concat(TILES).forEach(function(t){ keys[t.key] = 1; });
      FUNNELS.forEach(function(f){ f.steps.forEach(function(s){ keys[s.key] = 1; }); });
      Object.keys(STATE.counters).forEach(function(k){ keys[k] = 1; });
      Object.keys(keys).forEach(function(k){
        STATE.series[k] = dailySeries(STATE.dates, seriesOf(STATE.counters, k));
      });

      var lastDate = STATE.dates[STATE.dates.length - 1];
      var stamp = '最新の記録：' + lastDate + '（毎朝5時に自動記録）　／　データ期間：'
                + STATE.dates[0] + ' 〜 ' + lastDate + '（' + STATE.dates.length + '日分）';
      if (STATE.statsAt){
        var t = new Date(STATE.statsAt);
        stamp += '　／　今の累計：' + (t.getMonth()+1) + '/' + t.getDate() + ' '
               + t.getHours() + ':' + ('0' + t.getMinutes()).slice(-2) + ' 時点';
      }
      document.getElementById('stamp').textContent = stamp;
      render();
    })
    .catch(function(e){
      document.getElementById('app').innerHTML =
        '<div class="err">数字を取ってこられませんでした（' + esc(e.message) + '）。'
        + '時間をおいて開き直してください。</div>';
    });
}

function boot(){
  loadReport();
  // 今の累計を先に取ってから日別を読む（順番が逆だと、今日ぶんの列が空のまま描画される）
  loadStats().then(loadDaily);
}
boot();
})();
</script>
